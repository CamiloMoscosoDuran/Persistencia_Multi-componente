apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: practica-s11
  labels:
    app: backend-webflux
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-webflux
  template:
    metadata:
      labels:
        app: backend-webflux
    spec:
      containers:
        - name: backend-webflux
          image: backend-webflux:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-secret
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: practica-s11
  labels:
    app: backend-webflux
spec:
  type: NodePort
  selector:
    app: backend-webflux
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      name: http
