# Puerto del servidor web
server.port=${APP_PORT:8080}

# Conexión Reactiva a MongoDB utilizando variables inyectadas por Kubernetes
spring.data.mongodb.uri=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?authSource=admin

# Actuator y Sondas de Salud (Liveness / Readiness)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
